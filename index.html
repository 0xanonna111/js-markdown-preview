<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Markdown Preview</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="markdown">
    <h2>Markdown Preview</h2>

    <textarea
      id="input"
      placeholder="Write markdown here..."
      oninput="renderMarkdown()"
    ></textarea>

    <div id="preview"></div>
  </div>

  <script src="script.js"></script>
</body>
</html>
